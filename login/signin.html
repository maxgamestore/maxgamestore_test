<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Of Fights - Sign Up</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="signin.css">
</head>
<body>

    <!-- ============================================================
         SIGNUP VIEW
         ============================================================ -->
    <div class="signin-container" id="signup-view">
        <div class="signin-form-side">
            <div class="signin-form-wrapper">
                <div class="logo">
                    <span class="logo-icon">⚔️</span>
                    <h1 class="logo-text">CREATE ACCOUNT</h1>
                    <p class="logo-subtitle">MAXGAMESTORE CORPORATION</p>
                </div>

                <form id="signin-form" autocomplete="off">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="signin-username" required minlength="3" maxlength="24" placeholder="username">
                        <div class="form-hint" id="username-hint"></div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signin-email" required placeholder="email@example.com">
                        <div class="form-hint" id="email-hint"></div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signin-password" required minlength="8" placeholder="••••••••">
                        <div class="password-strength">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <div class="form-hint" id="password-hint"></div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signin-confirm" required placeholder="••••••••">
                        <div class="form-hint" id="confirm-hint"></div>
                    </div>

                    <div class="form-error" id="signin-error"></div>

                    <button type="submit" class="btn-primary" id="signin-btn">
                        CREATE ACCOUNT
                    </button>

                    <p class="form-switch">
                        <span>Already have an account?</span>
                        <a href="login.html">Login</a>
                    </p>
                </form>
            </div>
        </div>

        <div class="divider"></div>

        <div class="signin-image-side" id="signin-image-side">
            <div class="image-overlay"></div>
        </div>
    </div>

    <!-- ============================================================
         OTP VERIFICATION VIEW
         ============================================================ -->
    <div class="signin-container hidden" id="otp-view">
        <div class="otp-card">
            <div class="otp-header">
                <span class="otp-icon">📧</span>
                <h2>VERIFY YOUR EMAIL</h2>
            </div>

            <p class="otp-message">
                We sent a 6-digit code to:<br>
                <strong id="otp-email">email@example.com</strong>
            </p>

            <div class="otp-inputs" id="otp-inputs">
                <input type="text" maxlength="1" class="otp-digit" data-index="0" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-digit" data-index="1" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-digit" data-index="2" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-digit" data-index="3" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-digit" data-index="4" inputmode="numeric">
                <input type="text" maxlength="1" class="otp-digit" data-index="5" inputmode="numeric">
            </div>

            <div class="form-error" id="otp-error"></div>

            <button type="button" class="btn-primary" id="otp-verify-btn">
                VERIFY
            </button>

            <p class="otp-resend">
                <span>Didn't receive the code?</span>
                <a href="#" id="otp-resend">Resend</a>
            </p>
        </div>
    </div>

    <!-- ============================================================
         VERIFIED VIEW
         ============================================================ -->
    <div class="signin-container hidden" id="verified-view">
        <div class="verified-card">
            <div class="verified-icon">✅</div>
            <h1 class="verified-title">ACCOUNT VERIFIED!</h1>
            <p class="verified-message">Your account has been verified successfully.</p>
            <p class="verified-username" id="verified-username">Player</p>
            <p class="verified-instructions">Redirecting to main page...</p>
            <div class="verified-spinner"></div>
        </div>
    </div>

    <script src="signin.js"></script>
</body>
</html>
