<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Of Fights - Login</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ============================================================
         STAGE 1: LOGIN (split 40/60)
         ============================================================ -->
    <div id="stage-login" class="stage active">
        <div class="login-container">

            <!-- STÂNGA: FORM (40%) -->
            <div class="login-form-side">
                <div class="login-form-wrapper">
                    <div class="logo">
                        <span class="logo-icon">⚔️</span>
                        <h1 class="logo-text" data-i18n="login.title">WORLD OF FIGHTS</h1>
                        <p class="logo-subtitle" data-i18n="login.subtitle">MAXGAMESTORE CORPORATION</p>
                    </div>

                    <form id="login-form" autocomplete="off">
                        <div class="form-group">
                            <label data-i18n="login.username">Username</label>
                            <input type="text" id="login-username" required minlength="3" maxlength="24" placeholder="username">
                        </div>

                        <div class="form-group">
                            <label data-i18n="login.password">Password</label>
                            <input type="password" id="login-password" required minlength="8" placeholder="••••••••">
                        </div>

                        <div class="form-error" id="login-error"></div>

                        <button type="submit" class="btn-primary" id="login-btn" data-i18n="login.login_btn">
                            LOGIN
                        </button>

                        <p class="form-switch">
                            <span data-i18n="login.no_account">Don't have an account?</span>
                            <a href="signin.html" data-i18n="login.sign_in_btn">Sign Up</a>
                        </p>
                    </form>
                </div>
            </div>

            <!-- SEPARATOR OBLIC -->
            <div class="divider"></div>

            <!-- DREAPTA: IMAGINI (60%) -->
            <div class="login-image-side" id="login-image-side">
                <div class="image-overlay"></div>
            </div>

        </div>

        <!-- ANIMAȚIE 1 (se activează la click LOGIN) -->
        <div id="anim1" class="anim1 hidden">
            <div class="anim1-bar" id="anim1-bar"></div>
            <div class="anim1-text" id="anim1-user">username</div>
            <div class="anim1-text" id="anim1-pass">password</div>
            <div class="anim1-ui-burst" id="anim1-ui-burst"></div>
        </div>

    </div>

    <!-- ============================================================
         STAGE 2: VERIFY (OTP)
         ============================================================ -->
    <div id="stage-verify" class="stage">
        <div class="verify-container">

            <!-- IMAGINE CARE SE MIȘCĂ -->
            <div class="verify-bg" id="verify-bg"></div>

            <!-- CARD OTP -->
            <div class="otp-card">
                <div class="otp-header">
                    <span class="otp-icon">📧</span>
                    <h2 data-i18n="verify.title">VERIFY YOUR EMAIL</h2>
                </div>

                <p class="otp-message">
                    <span data-i18n="verify.message">We sent a 6-digit code to:</span><br>
                    <strong id="otp-email">user@example.com</strong>
                </p>

                <div class="otp-inputs" id="otp-inputs">
                    <input type="text" maxlength="1" class="otp-digit" data-index="0" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" data-index="1" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" data-index="2" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" data-index="3" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" data-index="4" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit" data-index="5" inputmode="numeric">
                </div>

                <div class="form-error" id="otp-error"></div>

                <button type="button" class="btn-primary" id="otp-verify-btn" data-i18n="verify.verify_btn">
                    VERIFY
                </button>

                <p class="otp-resend">
                    <span data-i18n="verify.resend">Didn't receive the code?</span>
                    <a href="#" id="otp-resend" data-i18n="verify.resend_btn">Resend</a>
                </p>
            </div>

        </div>
    </div>

    <!-- ============================================================
         STAGE 3: INTRO (ANIMAȚIA 2 - ELECTRICITATE)
         ============================================================ -->
    <div id="stage-intro" class="stage">
        <div class="intro-container">

            <!-- ELECTRICITATE DETALIATĂ (8 fulgere) -->
            <div class="intro-electricity" id="intro-electricity">
                <div class="lightning" id="lightning-1"></div>
                <div class="lightning" id="lightning-2"></div>
                <div class="lightning" id="lightning-3"></div>
                <div class="lightning" id="lightning-4"></div>
                <div class="lightning" id="lightning-5"></div>
                <div class="lightning" id="lightning-6"></div>
                <div class="lightning" id="lightning-7"></div>
                <div class="lightning" id="lightning-8"></div>
            </div>

            <!-- EXPLOZIE MARE -->
            <div class="intro-explosion" id="intro-explosion"></div>

            <!-- VORTEX (GAURA NEAGRĂ) -->
            <div class="intro-vortex" id="intro-vortex"></div>

            <!-- TEXT MAXGAMESTORE -->
            <div class="intro-text" id="intro-text">
                <h1>MAXGAMESTORE</h1>
            </div>

        </div>
    </div>

    <!-- ============================================================
         STAGE 4: MAIN (UI BAR)
         ============================================================ -->
    <div id="stage-main" class="stage">
        <div class="main-container">

            <div class="main-bar">
                <div class="main-bar-left">
                    <span class="user-icon">👤</span>
                    <span class="user-name" id="main-username">Player</span>
                    <span class="user-rank" id="main-rank">USER</span>
                    <span class="user-luna">💰 <span id="main-luna">100</span></span>
                </div>
                <div class="main-bar-right">
                    <a href="#" class="menu-link" data-i18n="main.shop">Shop</a>
                    <a href="#" class="menu-link" data-i18n="main.info">Info</a>
                    <a href="#" class="menu-link" data-i18n="main.games">Games</a>
                </div>
            </div>

            <div class="main-content">
                <p class="placeholder-text" data-i18n="main.placeholder">Content coming soon...</p>
            </div>

        </div>
    </div>

    <!-- ============================================================
         LANGUAGE SELECTOR (dreapta-jos)
         ============================================================ -->
    <div class="language-selector" id="language-selector">
        <button class="lang-btn" id="lang-btn">
            <span class="lang-flag" id="lang-flag">🇬🇧</span>
            <span class="lang-code" id="lang-code">EN</span>
            <span class="lang-arrow">▼</span>
        </button>
        <div class="lang-dropdown hidden" id="lang-dropdown">
            <!-- Se populează din JS -->
        </div>
    </div>

    <!-- ============================================================
         AUDIO ELEMENTS
         ============================================================ -->
    <audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
    <audio id="sfx-electric" src="../assets/sounds/electric_short.mp3" preload="auto"></audio>
    <audio id="sfx-explosion" src="../assets/sounds/explosion.mp3" preload="auto"></audio>
    <audio id="sfx-vortex" src="../assets/sounds/vortex.mp3" preload="auto"></audio>
    <audio id="sfx-electric-long" src="../assets/sounds/electric_long.mp3" preload="auto"></audio>
    <audio id="sfx-whoosh" src="../assets/sounds/whoosh.mp3" preload="auto"></audio>
    <audio id="sfx-error" src="../assets/sounds/error.mp3" preload="auto"></audio>

    <script src="login.js"></script>
</body>
</html>
