<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxGameStore - Dashboard</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- ============================================================
         BACKGROUND PERSISTENT (mereu vizibil)
         ============================================================ -->
    <div class="background-layer">
        <div class="bg-sky"></div>
        <div class="bg-ground">
            <div class="bg-trees"></div>
        </div>
    </div>

    <!-- ============================================================
         MAIN CONTAINER
         ============================================================ -->
    <div class="main-container" id="main-container">

        <!-- ============================================================
             TOP BAR - PLATFORM (MaxGameStore)
             ============================================================ -->
        <div class="top-bar top-bar-platform" id="top-bar-platform">
            <div class="bar-left">
                <span class="brand-logo">🏢</span>
                <span class="brand-name">MAXGAMESTORE</span>
            </div>
            <div class="bar-center">
                <a href="#" class="menu-link active" data-menu="home">🏠 Home</a>
                <a href="#" class="menu-link" data-menu="games">🎮 Games</a>
                <a href="#" class="menu-link" data-menu="shop">🛒 Shop</a>
                <a href="#" class="menu-link" data-menu="info">ℹ️ Info</a>
            </div>
            <div class="bar-right">
                <span class="user-info">
                    <span class="user-icon">👤</span>
                    <span class="user-name" id="main-username">Player</span>
                    <span class="user-rank" id="main-rank">USER</span>
                </span>
                <span class="user-gems" title="Gems">💵 <span id="main-gems">0</span></span>
                <a href="#" class="bar-icon-btn" id="settings-btn">⚙️</a>
                <a href="#" class="bar-icon-btn logout" id="logout-btn">🚪</a>
            </div>
        </div>

        <!-- ============================================================
             TOP BAR - WOF (hidden, apare după animație)
             ============================================================ -->
        <div class="top-bar top-bar-wof hidden" id="top-bar-wof">
            <div class="bar-left">
                <button class="bar-icon-btn" id="wof-back-btn">←</button>
                <span class="brand-logo-wof" id="wof-title-bar">⚔️</span>
                <span class="brand-name-wof">World Of Fights</span>
            </div>
            <div class="bar-right">
                <span class="user-info">
                    <span class="user-icon">👤</span>
                    <span class="user-name" id="wof-username">Player</span>
                    <span class="user-rank" id="wof-rank">USER</span>
                </span>
                <span class="currency luna">💰 <span id="wof-luna">100</span></span>
                <span class="currency lits">💎 <span id="wof-lits">0</span></span>
                <span class="currency gems">💵 <span id="wof-gems">0</span></span>
                <a href="#" class="menu-link" data-wof="shop">🛒 Shop</a>
                <a href="#" class="menu-link" data-wof="market">🌙 Market</a>
                <a href="#" class="menu-link" data-wof="chat">💬 Chat</a>
                <a href="#" class="menu-link disabled" data-wof="play">▶️ Play</a>
                <a href="#" class="bar-icon-btn" id="wof-settings-btn">⚙️</a>
                <a href="#" class="bar-icon-btn logout" id="wof-logout-btn">🚪</a>
            </div>
        </div>

        <!-- ============================================================
             CONTENT AREA
             ============================================================ -->
        <div class="content-area" id="content-area"></div>

        <!-- ============================================================
             WOF ANIMATION OVERLAY (doar titlul zboară)
             ============================================================ -->
        <div class="wof-animation hidden" id="wof-animation">
            <div class="wof-title-flying" id="wof-title-flying">⚔️ World Of Fights</div>
        </div>

    </div>

    <!-- MODALS -->
    <div class="modal hidden" id="profile-modal">
        <div class="modal-content">
            <button class="modal-close" data-close="profile-modal">×</button>
            <h2>👤 PROFILE</h2>
            <div class="profile-info">
                <div class="profile-row"><span>Username:</span><strong id="p-username">-</strong></div>
                <div class="profile-row"><span>Rank:</span><strong id="p-rank">-</strong></div>
                <div class="profile-row"><span>Email:</span><strong id="p-email">-</strong></div>
                <div class="profile-row"><span>Gems:</span><strong id="p-gems">-</strong></div>
                <div class="profile-row"><span>Luna:</span><strong id="p-luna">-</strong></div>
                <div class="profile-row"><span>Lits:</span><strong id="p-lits">-</strong></div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="settings-modal">
        <div class="modal-content">
            <button class="modal-close" data-close="settings-modal">×</button>
            <h2>⚙️ SETTINGS</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label>Theme</label>
                    <select id="setting-theme">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">SAVE</button>
            </form>
        </div>
    </div>

    <div class="global-message-overlay hidden" id="global-message-overlay">
        <div class="global-message-content">
            <span class="global-message-from" id="global-message-from">Admin</span>
            <span class="global-message-text" id="global-message-text">Message</span>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="WofMenu.js"></script>
    <script src="WofChat.js"></script>
    <script src="WofShop.js"></script>
    <script src="WofMarket.js"></script>
    <script src="WofInfo.js"></script>
    <script src="main.js"></script>

</body>
</html>
