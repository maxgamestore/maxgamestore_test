
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Of Fights - Main</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="main-container">

        <!-- ============================================================
             UI BAR SUS
             ============================================================ -->
        <div class="main-bar">
            <div class="main-bar-left">
                <span class="user-icon">👤</span>
                <span class="user-name" id="main-username">Player</span>
                <span class="user-luna">💰 <span id="main-luna">100</span></span>
            </div>
            <div class="main-bar-right">
                <a href="#" class="menu-link" data-menu="shop">Shop</a>
                <a href="#" class="menu-link" data-menu="info">Info</a>
                <a href="#" class="menu-link" data-menu="games">Games</a>
                <a href="#" class="menu-link logout" id="logout-btn">Logout</a>
            </div>
        </div>

        <!-- ============================================================
             CONȚINUT PRINCIPAL (gol momentan)
             ============================================================ -->
        <div class="main-content">
            <div class="welcome-section">
                <div class="welcome-logo">⚔️</div>
                <h1 class="welcome-title">BINE AI VENIT!</h1>
                <p class="welcome-subtitle">Conținutul va fi disponibil în curând...</p>
            </div>
        </div>

        <!-- ============================================================
             FOOTER
             ============================================================ -->
        <div class="main-footer">
            <p>© 2026 MaxGameStore Corporation. All rights reserved.</p>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
