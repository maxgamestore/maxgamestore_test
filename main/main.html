<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Of Fights</title>
    <link rel="icon" href="../assets/favicon.png">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- ============================================================
         MAIN CONTAINER
         ============================================================ -->
    <div class="main-container">

        <!-- ============================================================
             UI BAR SUS
             ============================================================ -->
        <div class="main-bar">
            <div class="main-bar-left">
                <span class="user-icon">👤</span>
                <span class="user-name" id="main-username">Player</span>
                <span class="user-rank" id="main-rank">USER</span>
                <span class="user-luna" title="Luna">💰 <span id="main-luna">100</span></span>
                <span class="user-lits" title="Lits">💎 <span id="main-lits">0</span></span>
            </div>
            <div class="main-bar-right">
                <a href="#" class="menu-link" data-menu="shop">Shop</a>
                <a href="#" class="menu-link" data-menu="info">Info</a>
                <a href="#" class="menu-link" data-menu="games">Games</a>
                <a href="#" class="menu-link logout" id="logout-btn">Logout</a>
            </div>
        </div>

        <!-- ============================================================
             CONȚINUT PRINCIPAL
             ============================================================ -->
        <div class="main-content">

            <!-- FEED (POSTS) -->
            <div class="feed-section">
                <div class="feed-header">
                    <h2 class="feed-title" data-i18n="main.feed_title">📰 FEED</h2>
                    <button class="btn-new-post hidden" id="new-post-btn">
                        ✏️ New Post
                    </button>
                </div>

                <div class="feed-list" id="feed-list">
                    <!-- Postările se încarcă din JS -->
                    <div class="feed-loading">
                        <div class="spinner"></div>
                        <p>Loading feed...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- ============================================================
             FOOTER
             ============================================================ -->
        <div class="main-footer">
            <p>© 2026 MaxGameStore Corporation. All rights reserved.</p>
        </div>

    </div>

    <!-- ============================================================
         MODAL: NEW POST (pentru admin/owner/dev)
         ============================================================ -->
    <div class="modal hidden" id="new-post-modal">
        <div class="modal-content">
            <button class="modal-close" data-close="new-post-modal">×</button>
            <h2>CREATE POST</h2>
            <form id="new-post-form">
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="post-message" required maxlength="500" placeholder="Write something..."></textarea>
                    <div class="char-count"><span id="post-char-count">0</span>/500</div>
                </div>
                <button type="submit" class="btn-primary">POST</button>
            </form>
        </div>
    </div>

    <!-- ============================================================
         MODAL: PROFILE
         ============================================================ -->
    <div class="modal hidden" id="profile-modal">
        <div class="modal-content">
            <button class="modal-close" data-close="profile-modal">×</button>
            <h2>PROFILE</h2>
            <div class="profile-info">
                <div class="profile-row">
                    <span>Username:</span>
                    <strong id="p-username">-</strong>
                </div>
                <div class="profile-row">
                    <span>Rank:</span>
                    <strong id="p-rank">-</strong>
                </div>
                <div class="profile-row">
                    <span>Email:</span>
                    <strong id="p-email">-</strong>
                </div>
                <div class="profile-row">
                    <span>Luna:</span>
                    <strong id="p-luna">-</strong>
                </div>
                <div class="profile-row">
                    <span>Lits:</span>
                    <strong id="p-lits">-</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         LANGUAGE SELECTOR
         ============================================================ -->
    <div class="language-selector" id="language-selector">
        <button class="lang-btn" id="lang-btn">
            <span class="lang-flag" id="lang-flag">🇬🇧</span>
            <span class="lang-code" id="lang-code">EN</span>
            <span class="lang-arrow">▼</span>
        </button>
        <div class="lang-dropdown hidden" id="lang-dropdown"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
