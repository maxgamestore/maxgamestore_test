
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Of Fights</title>
    <link rel="icon" href="assets/favicon.png">
    <style>
        /* ============================================================
           LOADING SCREEN (cât se face redirect)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            color: #ffffff;
        }

        .loading-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fundal cu particule */
        .loading-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
            animation: pulse-bg 3s ease-in-out infinite;
        }

        @keyframes pulse-bg {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Logo */
        .logo-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
            animation: logo-pulse 2s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        @keyframes logo-pulse {
            0%, 100% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6)); 
            }
            50% { 
                transform: scale(1.08); 
                filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.9)); 
            }
        }

        /* Titlu */
        .logo-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
            animation: text-fade-in 1.2s ease-out;
        }

        @keyframes text-fade-in {
            from { opacity: 0; letter-spacing: 20px; }
            to { opacity: 1; letter-spacing: 6px; }
        }

        /* Subtitlu */
        .subtitle {
            font-size: 13px;
            color: #b0b0b8;
            letter-spacing: 3px;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
            animation: text-fade-in 1.5s ease-out;
        }

        /* Loading bar */
        .loading-bar {
            width: 280px;
            height: 3px;
            background: rgba(255, 215, 0, 0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            margin-bottom: 15px;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 2px;
            animation: loading 1.8s ease-in-out forwards;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Loading text */
        .loading-text {
            font-size: 11px;
            color: #666673;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: 'SE ÎNCARCĂ'; }
            33% { content: 'SE ÎNCARCĂ.'; }
            66% { content: 'SE ÎNCARCĂ..'; }
            100% { content: 'SE ÎNCARCĂ...'; }
        }

        /* Dots animation (fallback) */
        .loading-text::after {
            content: '...';
            animation: dots-fade 1.5s infinite;
        }

        @keyframes dots-fade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #444450;
            letter-spacing: 1px;
            z-index: 2;
        }
    </style>

    <script>
        // ============================================================
        //  REDIRECT LOGIC
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            // Verifică dacă user-ul are sesiune validă
            const savedSession = localStorage.getItem('wof_session');
            
            if (savedSession) {
                // Are sesiune - redirecționează la main
                console.log('✅ Sesiune găsită - redirect la main');
                setTimeout(() => {
                    window.location.href = 'main/main.html';
                }, 1500);
            } else {
                // Nu are sesiune - redirecționează la login
                console.log('📝 Fără sesiune - redirect la login');
                setTimeout(() => {
                    window.location.href = 'login/login.html';
                }, 1800);
            }
        });
    </script>
</head>
<body>

    <div class="loading-container">
        <div class="logo-icon">⚔️</div>
        <h1 class="logo-text">WORLD OF FIGHTS</h1>
        <p class="subtitle">MAXGAMESTORE CORPORATION</p>
        
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
        
        <p class="loading-text">SE ÎNCARCĂ</p>
        
        <p class="footer">© 2026 MaxGameStore Corporation</p>
    </div>

</body>
</html>
